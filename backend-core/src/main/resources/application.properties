# Server configuration
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/whiteboard_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Shared with Rust Fast Backend)
jwt.secret=${JWT_SECRET_KEY:default_secret_key_needs_to_be_long_enough_for_hs256_algorithm_12345}
# 24 hours in milliseconds
jwt.expiration-time=86400000

# Security (Disable basic auth prompt)
spring.security.user.name=admin
spring.security.user.password=admin
