[package]
name = "backend-fast"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "10.4.0"
chrono = { version = "0.4", features = ["serde"] }
